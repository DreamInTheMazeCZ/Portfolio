services:

  # =========================================================
  # Kafka
  # =========================================================
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      # KRaft mode
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      
      # Listeners
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      # Controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Single Broker
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
       
      # Log Directory
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - data_network


  # =========================================================
  # Kafka UI
  # =========================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui

    ports:
      - "8081:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

    depends_on:
      - kafka

    networks:
      - data_network


  # =========================================================
  # Spark Master
  # =========================================================
  spark-master:
    image: apache/spark:4.0.0
    container_name: spark-master

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master

    ports:
      - "8080:8080"
      - "7077:7077"

    networks:
      - data_network


  # =========================================================
  # Spark Worker 1
  # =========================================================
  spark-worker-1:
    image: apache/spark:4.0.0
    container_name: spark-worker-1

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

    depends_on:
      - spark-master

    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G

    networks:
      - data_network


  # =========================================================
  # Spark Worker 2
  # =========================================================
  spark-worker-2:
    image: apache/spark:4.0.0
    container_name: spark-worker-2

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

    depends_on:
      - spark-master

    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G

    networks:
      - data_network


  # =========================================================
  # Spark Connect
  # =========================================================
  spark-connect:
    image: apache/spark:4.0.0
    container_name: spark-connect
    hostname: spark-connect

    user: root

    environment:
      SPARK_NO_DAEMONIZE: "True"
      SPARK_LOCAL_HOSTNAME: spark-connect

      PYSPARK_PYTHON: /usr/bin/python3
      PYSPARK_DRIVER_PYTHON: /usr/bin/python3

      PYTHONPATH: /opt/spark/python:/opt/spark/python/lib/pyspark.zip:/opt/spark/python/lib/py4j-0.10.9.9-src.zip

    command: >
      sh -c "
      python3 -m pip install --no-cache-dir
      'pandas>=2.0.0'
      'pyarrow>=11.0.0'
      'grpcio>=1.67.0'
      'grpcio-status>=1.67.0'
      'googleapis-common-protos>=1.65.0'
      'py4j>=0.10.9.7,<0.10.9.10' &&
      /opt/spark/sbin/start-connect-server.sh
      --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.0,org.postgresql:postgresql:42.7.8
      --conf spark.jars.ivy=/tmp/.ivy2
      --conf spark.connect.grpc.binding.address=0.0.0.0
      --conf spark.connect.grpc.binding.port=15002
      --conf spark.driver.host=spark-connect
      --conf spark.driver.bindAddress=0.0.0.0
      "

    volumes:
      - ./spark/log4j2.properties:/opt/spark/conf/log4j2.properties

    ports:
      - "15002:15002"

    depends_on:
      - spark-master

    networks:
      - data_network


  # =========================================================
  # PostgreSQL
  # =========================================================
  postgres:
    image: postgres:16
    container_name: postgres

    ports:
      - "5433:5432"

    environment:
      POSTGRES_DB: sparkdb
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark1234

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - data_network


# =========================================================
# Volumes
# =========================================================

volumes:
  kafka_data:
  postgres_data:
  


# =========================================================
# Network
# =========================================================

networks:
  data_network:
    driver: bridge